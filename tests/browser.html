<!doctype html><meta charset="utf-8"><title>Browser integration tests</title><pre id="output">RUNNING</pre><iframe id="app" src="../index.html"></iframe><script>
(async()=>{
const output=document.querySelector('#output'),frame=document.querySelector('#app');
const results=[];
const check=(condition,name)=>{if(!condition)throw Error(name);results.push('PASS '+name);};
const wait=async(fn)=>{for(let i=0;i<500;i++){if(fn())return;await fetch('/__test_tick',{cache:'no-store'});}throw Error('Timed out: '+fn+' / status: '+frame.contentDocument.querySelector('#status')?.textContent+' / errors: '+frame.contentDocument.querySelector('#errors')?.textContent);};
try{
await wait(()=>frame.contentWindow.Bingo&&frame.contentDocument.querySelector('#fast').onclick!==undefined&&frame.contentDocument.querySelector('#preview').children.length>0);
const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),form=$('settings');w.localStorage.removeItem('xmas-bingo-history-v1');
check(form.elements.prizes.disabled,'景品数未定モードは個数上限入力を無効化');check($('prizesField').classList.contains('inactive-field')&&!$('prizesInactive').hidden&&$('prizesHelp').textContent.includes('使いません'),'無効バッジ・背景・理由を表示');$('estimatePrizes').click();check(!form.elements.prizes.disabled&&$('prizesInactive').hidden&&!$('prizesField').classList.contains('inactive-field'),'景品数指定モードへ切替');$('estimatePrizes').click();
$('modeTheory').click();check($('simulator').hidden&&!$('theory').hidden,'理論値モードへ切替');
check($('theoryTable').querySelectorAll('tbody tr').length===21,'理論値は10〜30回の21行');
check($('theoryTable').querySelector('tbody td').textContent==='2.2人'&&$('theoryTable').querySelector('tbody tr:last-child td:last-child').textContent==='7.2人','理論値の提示表と一致');
check(!$('theoryCsv').disabled,'理論値CSVを保存可能');
$('theoryParticipants').value='100';$('theoryParticipants').dispatchEvent(new w.Event('input',{bubbles:true}));check($('theoryCsv').disabled,'設定変更後に古いCSVを保存しない');
$('theoryForm').requestSubmit();check($('theoryTable').querySelector('tbody td').textContent==='4.5人','参加人数の変更が理論値へ反映');
$('theoryBalls').value='23';$('theoryForm').requestSubmit();check($('theoryErrors').textContent.includes('24')&&$('theoryCsv').disabled,'理論値の不正な球数を日本語で拒否');
$('theoryBalls').value='30,35,40,45,50,60,75';$('theoryParticipants').value='50';$('theoryForm').requestSubmit();
frame.style.width='375px';await new Promise(r=>setTimeout(r,50));check(d.documentElement.scrollWidth<=frame.clientWidth,'理論値表も375px幅で画面が横にはみ出さない');
$('modeSimulation').click();check(!$('simulator').hidden&&$('theory').hidden,'大会シミュレーションへ戻れる');
const input=(name,val)=>{form.elements[name].value=val;form.elements[name].dispatchEvent(new w.Event('input',{bubbles:true}));};
$('preset').value='90';$('preset').dispatchEvent(new w.Event('input',{bubbles:true}));$('preset').dispatchEvent(new w.Event('change',{bubbles:true}));check(form.elements.ballCount.value==='90','90球プリセットの反映');
$('preset').value='75';$('preset').dispatchEvent(new w.Event('input',{bubbles:true}));$('preset').dispatchEvent(new w.Event('change',{bubbles:true}));check(form.elements.ballCount.value==='75','75球プリセットの反映');
check($('preview').children.length===30,'プレビューに25マスと5列の見出し');check($('preview').children[17].textContent==='FREE','中央FREE表示');
input('trials',2);input('participants',3);$('fast').click();await wait(()=>$('status').textContent.includes('完了しました'));check(JSON.parse(w.localStorage.getItem('xmas-bingo-history-v1'))[0].settings.columnRanges,'列ONのWorker計算');w.localStorage.removeItem('xmas-bingo-history-v1');
input('ballCount',24);check($('fast').disabled&&$('errors').textContent.includes('O列'),'24球・列ONは開始不可');
$('columnRanges').click();check(!$('fast').disabled,'24球・列OFFは開始可能');
input('ballCount',90);input('participants',5);$('rankPrizes').click();input('topWinners',2);input('topPrizeCount',3);check(form.elements.maxWins.disabled&&!form.elements.topWinners.disabled,'上位配布ONの優先設定');input('trials',3);input('duration',2);input('drawInterval',1);input('awardSeconds',0);
$('fast').click();await wait(()=>$('status').textContent.includes('完了しました'));
check($('result').querySelectorAll('.metric').length===7,'高速結果の7指標');check($('result').textContent.includes('参加賞を用意する人'),'参加賞とビンゴ景品受取人数の平均を表示');
let records=JSON.parse(w.localStorage.getItem('xmas-bingo-history-v1'));check(records.length===1&&records[0].settings.estimatePrizes&&records[0].settings.rankPrizes&&records[0].settings.topWinners===2&&records[0].settings.topPrizeCount===3&&records[0].result.version===2&&records[0].result.participationRecipients&&records[0].settings.ballCount===90&&!records[0].settings.columnRanges,'履歴に90球・列OFFを保存');
$('history').querySelector('button').click();check($('detail').open&&$('detailContent').textContent.includes('90'),'履歴詳細');
$('restore').click();check(form.elements.ballCount.value==='90'&&!$('columnRanges').checked&&$('rankPrizes').checked&&form.elements.topWinners.value==='2'&&form.elements.topPrizeCount.value==='3','履歴から設定復元');
input('ballCount',24);input('awardSeconds',1000);$('animate').click();$('pause').click();check($('pause').textContent==='再開','一時停止');$('pause').click();$('speed').value='20';await wait(()=>$('status').textContent.includes('アニメーションが完了しました'));
check($('drawn').textContent.split(' ・ ').length===24,'アニメーションで全球24球を重複なく抽選');check(new Set($('drawn').textContent.split(' ・ ')).size===24,'再生抽選の重複なし');check($('liveCard').children[17].textContent==='FREE','再生カードのFREE');check($('result').textContent.includes('ビンゴ景品を受け取る人 0人、参加賞を用意する人 5人'),'再生でも受取時間切れは参加賞の人数へ集計');
const checks=$('history').querySelectorAll('input');checks.forEach(x=>x.click());check($('comparison').textContent.includes('90')&&$('comparison').textContent.includes('24')&&$('comparison').textContent.includes('自由配置'),'履歴比較に球数と方式');
$('rankPrizes').click();check(!form.elements.maxWins.disabled&&form.elements.topWinners.disabled,'上位配布OFFで従来設定へ復帰');input('trials',100000);$('fast').click();$('cancel').click();check($('status').textContent.includes('キャンセル')&&!$('fast').disabled,'Workerキャンセルで設定を再編集可能');check(JSON.parse(w.localStorage.getItem('xmas-bingo-history-v1')).length===2,'キャンセルした履歴は保存しない');
const oldTheme=d.body.classList.contains('light');$('theme').click();check(d.body.classList.contains('light')!==oldTheme,'テーマ切替');
frame.style.width='375px';await new Promise(r=>setTimeout(r,50));check(d.documentElement.scrollWidth<=frame.clientWidth,'375px幅で画面の横はみ出しなし');
output.textContent=results.join('\n')+'\nALL PASSED ('+results.length+')';
}catch(e){output.textContent=results.join('\n')+'\nFAIL '+e.stack;}
})();
</script>
